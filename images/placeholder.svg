  <rect width="800" height="420" rx="14" fill="#080d0a"/>
  <rect x="1" y="1" width="798" height="418" rx="13" fill="none" stroke="#1c2b22" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="38" rx="5" fill="#162a1f"/>
  <circle cx="43" cy="43" r="5" fill="#ff5f56"/><circle cx="61" cy="43" r="5" fill="#f5c451"/><circle cx="79" cy="43" r="5" fill="#4ade80"/>
